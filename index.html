<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0">

    <title>福州佳辉装饰</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #8d1d16,
                    #c94822,
                    #f0c271
                );

            min-height: 100vh;

            display: flex;
            justify-content: center;

            color: #333;
        }

        .page {
            width: 100%;
            max-width: 500px;

            min-height: 100vh;

            padding: 40px 22px;
        }

        .header {
            text-align: center;
            color: white;

            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 17px;
            opacity: 0.9;
        }

        .card {
            background: rgba(255,255,255,0.96);

            border-radius: 24px;

            padding: 32px 22px;

            box-shadow:
                0 12px 40px
                rgba(80, 20, 10, 0.25);

            text-align: center;
        }

        .company {
            font-size: 28px;
            font-weight: bold;

            color: #9e2119;

            margin-bottom: 10px;
        }

        .service {
            font-size: 22px;

            margin-bottom: 35px;

            color: #555;
        }

        .phone-number {
            font-size: 31px;

            font-weight: bold;

            color: #b3261e;

            margin-bottom: 25px;
        }

        .btn {
            display: block;

            width: 100%;

            text-decoration: none;

            padding: 17px;

            border-radius: 14px;

            font-size: 19px;

            font-weight: bold;

            margin-top: 16px;
        }

        .phone {
            background: #d9362b;

            color: white;
        }

        .map {
            background: #f3c45c;

            color: #662c13;
        }

        .tip {
            color: #777;

            font-size: 14px;

            margin-top: 28px;

            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="header">

        <h1>月满中秋</h1>

        <p>家添新颜</p>

    </div>


    <div class="card">

        <div class="company">
            福州佳辉装饰
        </div>

        <div class="service">
            立邦刷新服务
        </div>

        <div class="phone-number">
            13850113511
        </div>


        <!-- 一键拨号 -->
        <a
            class="btn phone"
            href="tel:13850113511">

            ☎ 一键电话咨询

        </a>


        <!-- 一键导航 -->
        <a
            class="btn map"
            href="https://uri.amap.com/marker?position=119.339624,26.081442&name=立邦刷新服务&src=&coordinate=gaode&callnative=0
">

            📍 一键导航到门店

        </a>


        <div class="tip">

            专业墙面刷新 · 家居焕新服务
            <br>

            点击上方按钮即可联系我们

        </div>

    </div>

</div>

</body>

</html>
